<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>My Awesome Website</title>
  <!-- js-dos style sheet -->
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">

  <!-- js-dos -->
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
</head>
<body>
  <div id="dos" style="width: 100vw; height: 100vh;"></div>

  <script>
    // Get romFile from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const romFile = urlParams.get('jsDosFile');
    
    if (!romFile) {
      document.getElementById("dos").innerHTML = '<p style="color: white; text-align: center; padding: 20px;">Error: No ROM file specified. Please provide a romFile parameter.</p>';
    } else {
      Dos(document.getElementById("dos"), {
        url: romFile,
        autoStart: true,
        noCloud: true,
      });
    }
  </script>
</body>
</html>
